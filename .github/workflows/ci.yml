name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detections:
    name: Rules, detection tests & backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate rule packs (schema, safe YAML, compile)
        run: python -m app.cli rules validate
      - name: Per-rule unit tests (match / no-match cases)
        run: python -m app.cli rules test
      - name: ATT&CK coverage report is up to date
        run: python -m app.cli coverage export --check
      - name: Backend test suite
        run: python -m pytest -q

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  windows-collector:
    name: Agentless collector on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Run discovery.ps1 on the runner and validate its inventory
        working-directory: backend
        env:
          SF_TEST_LIVE: "1"
        run: python -m pytest -q tests/test_discovery.py -k live
