# SentinelForge: backend (FastAPI) + frontend (nginx serving the built React app) + PostgreSQL.
#   docker compose up --build        ->  http://localhost:8080
# Credentials below are local-development placeholders; override them via .env for anything real.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelforge
      POSTGRES_USER: sentinelforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelforge-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelforge"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sentinelforge:${POSTGRES_PASSWORD:-sentinelforge-dev}@db:5432/sentinelforge
      CORS_ORIGINS: http://localhost:8080
      RULE_PATHS: builtin,/srv/sentinelforge/custom-rules
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
