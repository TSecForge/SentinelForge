[project]
name = "sentinelforge-server"
version = "0.2.0"
description = "SentinelForge server: REST API, database, SIEM gateway and dashboard backend"
authors = [{ name = "Sujhal Gurav" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "sentinelforge-detect==0.2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0.30,<2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
sentinelforge-server = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
