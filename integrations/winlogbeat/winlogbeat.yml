# Winlogbeat (8.x) -> Logstash -> SentinelForge
# Collects only the channels / event IDs SentinelForge's Windows rules use.
# 5156/5157 (Filtering Platform) are high volume and need the "Filtering Platform Connection" audit policy;
# remove them if you already collect Sysmon event 3.

winlogbeat.event_logs:
  - name: Security
    event_id: 1102, 4624, 4625, 4688, 4698, 4720, 4728, 4732, 4733, 4756, 4769, 5154, 5156, 5157
  - name: System
    event_id: 104, 7045
  - name: Microsoft-Windows-Sysmon/Operational
    event_id: 1, 3, 22

# SentinelForge reads winlog.event_data / winlog.user_data, which Winlogbeat keeps alongside its ECS fields.
output.logstash:
  hosts: ["logstash.example.internal:5044"]
  # ssl.certificate_authorities: ["C:/ProgramData/winlogbeat/ca.pem"]

logging.level: info
