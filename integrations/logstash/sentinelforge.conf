# Logstash pipeline: Beats (Winlogbeat) in, SentinelForge out.
# Set SENTINELFORGE_API_KEY in the Logstash environment or keystore.

input {
  beats {
    port => 5044
  }
}

filter {
  # Only Windows event log records go to the windows parser.
  if ![winlog] {
    drop { }
  }
}

output {
  http {
    url         => "https://sentinelforge.example.internal/api/v1/ingest/windows"
    http_method => "post"
    format      => "json_batch"
    headers     => { "X-API-Key" => "${SENTINELFORGE_API_KEY}" }
    retry_failed => true
  }

  # Keep sending everything to your SIEM as before, if you want SentinelForge alongside rather than in front:
  # elasticsearch { hosts => ["https://es.example.internal:9200"] }
}
