# Fluent Bit (2.x / 3.x) -> SentinelForge
# Linux: sshd journal entries.  Kubernetes: the API server audit log file (control-plane nodes).
# Set SENTINELFORGE_API_KEY in the service environment.

[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File /etc/fluent-bit/parsers.conf

[INPUT]
    Name                systemd
    Tag                 linux.journal
    Systemd_Filter      _SYSTEMD_UNIT=ssh.service
    Systemd_Filter      _SYSTEMD_UNIT=sshd.service
    Systemd_Filter_Type Or
    Read_From_Tail      On

[INPUT]
    Name    tail
    Tag     k8s.audit
    Path    /var/log/kubernetes/audit/audit.log
    Parser  json
    DB      /var/lib/fluent-bit/k8s-audit.db

[OUTPUT]
    Name    http
    Match   linux.*
    Host    sentinelforge.example.internal
    Port    443
    tls     On
    URI     /api/v1/ingest/linux
    Format  json
    Header  X-API-Key ${SENTINELFORGE_API_KEY}

[OUTPUT]
    Name    http
    Match   k8s.audit
    Host    sentinelforge.example.internal
    Port    443
    tls     On
    # audit records have no hostname: name the cluster
    URI     /api/v1/ingest/kubernetes?host=prod-cluster
    Format  json
    Header  X-API-Key ${SENTINELFORGE_API_KEY}
