id: DET-K8S-004
name: Kubernetes Secrets Listed by a Non-System Identity
description: >
  A human or workload identity listed or watched Secrets. Controllers normally do this; people and
  application service accounts rarely need to.
version: "1.0"
author: Sujhal Gurav
source: builtin
platform: kubernetes
event_type: k8s_audit
severity: medium
fidelity: medium
category: kubernetes
selection:
  k8s.resource: secrets
  k8s.verb: [list, watch]
condition:
  not:
    actor.user|startswith: "system:"
summary: "{actor.user} listed secrets in namespace {k8s.namespace}"
mitre: {tactic: credential-access, technique: T1552.007}
tags: [kubernetes, secrets]
false_positives:
  - CI/CD service accounts or operators that manage secrets
